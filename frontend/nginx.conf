server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # 不要把 text/event-stream 加进来：gzip 会把流攒成一大段再发
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 单页应用：刷新任意路由都回到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带哈希，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API（含 SSE 与 Swagger /api/docs）：同源反代，前端永远只请求 /api
    location /api/ {
        proxy_pass http://backend:8000;        # 不带 URI，原样转发 /api/...
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;                   # SSE 的关键：关缓冲，逐帧下发
        proxy_cache off;
        proxy_read_timeout 900s;               # 评测、压测的事件流可能持续好几分钟
        client_max_body_size 60m;              # 评测集导入
    }
}
