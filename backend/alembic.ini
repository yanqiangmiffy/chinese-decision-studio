# Alembic config. Keep this file ASCII-only: alembic reads it with the system
# locale encoding, so non-ASCII comments break `alembic` on Chinese Windows (GBK).
#
# The database URL is NOT set here: migrations/env.py reads it from app.config,
# so migrations always use the same settings as the app.
#
#   alembic upgrade head                           # run on container start
#   alembic revision --autogenerate -m "add xxx"   # after editing app/db/models.py
#   alembic upgrade head --sql                     # print SQL only, no DB needed

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
